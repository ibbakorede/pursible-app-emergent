<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- White background with rounded corners -->
  <rect width="1024" height="1024" rx="230" fill="#ffffff"/>
  <!-- Olive green stem -->
  <rect x="268" y="212" width="168" height="600" rx="84" fill="#7a8c1e"/>
  <!-- Dark teal bowl -->
  <circle cx="556" cy="462" r="272" fill="#2d4a52"/>
  <!-- Cutout to make D shape / P bowl -->
  <rect x="268" y="212" width="288" height="420" fill="#ffffff"/>
  <!-- Restore stem over cutout -->
  <rect x="268" y="212" width="168" height="600" rx="84" fill="#7a8c1e"/>
  <!-- Inner circle cutout -->
  <circle cx="556" cy="462" r="166" fill="#ffffff"/>
</svg>
